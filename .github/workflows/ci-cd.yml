name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run build
      run: npm run build

    - name: Install Firebase CLI
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: npm install -g firebase-tools

    - name: Deploy hosting and Firestore
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: firebase deploy --only hosting,firestore --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    - name: Mark chat requests done
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
          echo "Нет FIREBASE_SERVICE_ACCOUNT — статус в чате не обновится."
          exit 0
        fi
        npm install firebase-admin@13
        node scripts/mark-chat-done.mjs

  automerge:
    needs: build
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'calendar-site-chat-automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" || true
          gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --delete-branch

      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          git fetch origin main
          git checkout origin/main
          npm ci
          npm install -g firebase-tools
          npm install firebase-admin@13

      - name: Deploy hosting after chat merge
        run: firebase deploy --only hosting,firestore --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Mark chat request done
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/mark-chat-done.mjs
