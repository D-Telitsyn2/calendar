name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run build
      run: npm run build

    - name: Install function dependencies
      run: npm ci --prefix functions

    - name: Build functions
      run: npm run build --prefix functions

    - name: Install Firebase CLI
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: npm install -g firebase-tools

    - name: Deploy hosting and Firestore
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: firebase deploy --only hosting,firestore --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    - name: Deploy functions
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: firebase deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  automerge:
    needs: build
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'calendar-site-chat-automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" || true
          gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --delete-branch
