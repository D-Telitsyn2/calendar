name: Process agent chat

on:
  workflow_dispatch:
  repository_dispatch:
    types: [agent-chat]

concurrency:
  group: process-agent-chat
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install firebase-admin
        run: npm install firebase-admin@13
      - name: Process pending chat requests
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Секрет FIREBASE_SERVICE_ACCOUNT не задан — очередь не обрабатывается."
            exit 0
          fi
          node scripts/process-agent-chat.mjs
